name: HOME Dev Release

on:
  push:
    tags:
      - "home-dev-*"

permissions:
  contents: read

jobs:
  build-and-push-images:
    name: Build and Push HOME Dev Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.release-meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select HOME dev image tag
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_REF_NAME}"
          case "$IMAGE_TAG" in
            home-dev-*) ;;
            *)
              echo "Unsupported HOME dev release tag: $IMAGE_TAG" >&2
              exit 1
              ;;
          esac
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building and publishing HOME dev images for release tag $IMAGE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/nexoc/campus-frontend:${{ steps.release-meta.outputs.image_tag }}

      - name: Build and push auth
        uses: docker/build-push-action@v6
        with:
          context: ./auth
          push: true
          tags: ghcr.io/nexoc/campus-auth:${{ steps.release-meta.outputs.image_tag }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/nexoc/campus-backend:${{ steps.release-meta.outputs.image_tag }}

      - name: Build and push campus-nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/nexoc/campus-nginx:${{ steps.release-meta.outputs.image_tag }}

      - name: Build and push importer
        uses: docker/build-push-action@v6
        with:
          context: ./importer
          push: true
          tags: ghcr.io/nexoc/campus-importer:${{ steps.release-meta.outputs.image_tag }}

  deploy-home-dev:
    name: Deploy HOME DEV to s5-dev
    needs: build-and-push-images
    runs-on:
      - self-hosted
      - Linux
      - X64
      - home
      - gw
      - deploy
    concurrency:
      group: campus-home-dev-release
      cancel-in-progress: false
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: /home/nexoc/.kube/dev.yaml
      CAMPUS_SECRETS_ROOT: /home/nexoc/campus-secrets
      RELEASE_ENV: home
      DEPLOY_NAMESPACE: campus-dev
      EXPECTED_NODEPORT: "30080"
      EXPECTED_HOST: home-campus-dev.davl.at
      SMOKE_NODE: s5-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Show release inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "Release tag: ${{ needs.build-and-push-images.outputs.image_tag }}"
          echo "Target runner: home+gw+deploy"
          echo "Target overlay: $RELEASE_ENV"
          echo "Target namespace: $DEPLOY_NAMESPACE"
          echo "Expected nodeport: $EXPECTED_NODEPORT"
          echo "Expected host: $EXPECTED_HOST"
          echo "Smoke node: $SMOKE_NODE"

      - name: Verify cluster access
        shell: bash
        run: |
          set -euo pipefail
          kubectl get nodes -o wide

      - name: Verify host secret files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$CAMPUS_SECRETS_ROOT/$RELEASE_ENV/db-secrets.env" \
            "$CAMPUS_SECRETS_ROOT/$RELEASE_ENV/auth-secrets.env"
          do
            [[ -f "$path" ]] || {
              echo "Missing required host secret file: $path" >&2
              exit 1
            }
          done

      - name: Ensure namespace and GHCR pull secret
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          kubectl create namespace "$DEPLOY_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          if [[ -n "${GHCR_PULL_TOKEN:-}" ]]; then
            pull_username="${GHCR_PULL_USERNAME:-$GHCR_REPOSITORY_OWNER}"
            pull_password="${GHCR_PULL_TOKEN}"
            echo "Using persistent GHCR pull credentials"
          else
            pull_username="${GHCR_REPOSITORY_OWNER}"
            pull_password="${GHCR_FALLBACK_TOKEN}"
            echo "::warning::GHCR_PULL_TOKEN is not configured. Falling back to workflow GITHUB_TOKEN; future restarts may fail once that token expires."
          fi

          kubectl create secret docker-registry ghcr-pull \
            --namespace "$DEPLOY_NAMESPACE" \
            --docker-server ghcr.io \
            --docker-username "${pull_username}" \
            --docker-password "${pull_password}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply HOME overlay
        shell: bash
        run: |
          set -euo pipefail
          kubectl delete deployment campus-test -n "$DEPLOY_NAMESPACE" --ignore-not-found
          kubectl delete service campus-test -n "$DEPLOY_NAMESPACE" --ignore-not-found
          kubectl delete httproute campus-test -n "$DEPLOY_NAMESPACE" --ignore-not-found
          kubectl delete job campus-importer -n "$DEPLOY_NAMESPACE" --ignore-not-found
          kubectl apply -f deploy/infra/envoy-gateway/gatewayclass.yaml
          bash deploy/scripts/apply-overlay.sh \
            --environment "$RELEASE_ENV" \
            --image-tag "${{ needs.build-and-push-images.outputs.image_tag }}"

      - name: Verify HOME overlay
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/scripts/verify-overlay.sh \
            --environment "$RELEASE_ENV" \
            --expected-nodeport "$EXPECTED_NODEPORT"

      - name: Smoke HOME DEV HTTP route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 10 \
              -H "Host: $EXPECTED_HOST" \
              "http://$SMOKE_NODE:$EXPECTED_NODEPORT/"
            then
              echo "HOME DEV smoke check succeeded via $SMOKE_NODE on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "HOME DEV smoke check failed for $EXPECTED_HOST via $SMOKE_NODE:$EXPECTED_NODEPORT" >&2
          exit 1

      - name: Show deployed resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl get all -n "$DEPLOY_NAMESPACE" -o wide
          kubectl get gateway,httproute,envoyproxy,clienttrafficpolicy -n "$DEPLOY_NAMESPACE" -o wide
          kubectl get gatewayclass
          kubectl get svc -n envoy-gateway-system
