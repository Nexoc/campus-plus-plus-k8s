name: Deploy DEV

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: campus-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on:
      - self-hosted
      - Linux
    timeout-minutes: 25
    env:
      KUBECONFIG: /home/nexoc/.kube/config
      CAMPUS_SECRETS_ROOT: /home/nexoc/campus-secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify cluster access
        shell: bash
        run: |
          set -euo pipefail
          kubectl get nodes -o wide

      - name: Verify DEV host secret files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$CAMPUS_SECRETS_ROOT/dev/db-secrets.env" \
            "$CAMPUS_SECRETS_ROOT/dev/auth-secrets.env"
          do
            [[ -f "$path" ]] || {
              echo "Missing required host secret file: $path" >&2
              exit 1
            }
          done

      - name: Stage runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/dev/secrets
          cp "$CAMPUS_SECRETS_ROOT/dev/db-secrets.env" deploy/dev/secrets/db-secrets.env
          cp "$CAMPUS_SECRETS_ROOT/dev/auth-secrets.env" deploy/dev/secrets/auth-secrets.env

      - name: Ensure namespace and GHCR pull secret
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f deploy/dev/namespace.yaml
          kubectl create secret docker-registry ghcr-pull \
            --namespace campus-dev \
            --docker-server ghcr.io \
            --docker-username "${{ github.repository_owner }}" \
            --docker-password "${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl delete deployment campus-test -n campus-dev --ignore-not-found
          kubectl delete service campus-test -n campus-dev --ignore-not-found
          kubectl delete httproute campus-test -n campus-dev --ignore-not-found
          kubectl delete job campus-importer -n campus-dev --ignore-not-found
          kubectl apply -f deploy/infra/envoy-gateway/gatewayclass.yaml
          kubectl apply -k deploy/dev

      - name: Restart app deployments for dev-latest
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout restart deployment/frontend -n campus-dev
          kubectl rollout restart deployment/auth -n campus-dev
          kubectl rollout restart deployment/backend -n campus-dev
          kubectl rollout restart deployment/campus-nginx -n campus-dev

      - name: Wait for app rollouts
        shell: bash
        run: |
          set -euo pipefail
          for name in frontend auth backend campus-nginx; do
            kubectl rollout status "deployment/$name" -n campus-dev --timeout=300s
          done

      - name: Wait for importer job
        shell: bash
        run: |
          set -euo pipefail
          kubectl wait --for=condition=complete job/campus-importer -n campus-dev --timeout=600s
          kubectl logs job/campus-importer -n campus-dev

      - name: Show deployed resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl get all -n campus-dev -o wide
          kubectl get gateway,httproute,envoyproxy -n campus-dev -o wide
          kubectl get gatewayclass
          kubectl get svc -n envoy-gateway-system
