name: Deploy DEV

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: campus-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on:
      - self-hosted
      - Linux
    timeout-minutes: 25
    env:
      KUBECONFIG: /home/nexoc/.kube/config
      CAMPUS_SECRETS_ROOT: /home/nexoc/campus-secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select immutable image tag
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            DEPLOY_SHA="${GITHUB_SHA}"
          fi
          SHORT_SHA="${DEPLOY_SHA::7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying commit ${DEPLOY_SHA} as image tag sha-${SHORT_SHA}"

      - name: Verify cluster access
        shell: bash
        run: |
          set -euo pipefail
          kubectl get nodes -o wide

      - name: Verify DEV host secret files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$CAMPUS_SECRETS_ROOT/dev/db-secrets.env" \
            "$CAMPUS_SECRETS_ROOT/dev/auth-secrets.env"
          do
            [[ -f "$path" ]] || {
              echo "Missing required host secret file: $path" >&2
              exit 1
            }
          done

      - name: Stage runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/dev/secrets
          cp "$CAMPUS_SECRETS_ROOT/dev/db-secrets.env" deploy/dev/secrets/db-secrets.env
          cp "$CAMPUS_SECRETS_ROOT/dev/auth-secrets.env" deploy/dev/secrets/auth-secrets.env

      - name: Ensure namespace and GHCR pull secret
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          kubectl apply -f deploy/dev/namespace.yaml

          if [[ -n "${GHCR_PULL_TOKEN:-}" ]]; then
            pull_username="${GHCR_PULL_USERNAME:-$GHCR_REPOSITORY_OWNER}"
            pull_password="${GHCR_PULL_TOKEN}"
            echo "Using persistent GHCR pull credentials"
          else
            pull_username="${GHCR_REPOSITORY_OWNER}"
            pull_password="${GHCR_FALLBACK_TOKEN}"
            echo "::warning::GHCR_PULL_TOKEN is not configured. Falling back to workflow GITHUB_TOKEN; future restarts may fail once that token expires."
          fi

          kubectl create secret docker-registry ghcr-pull \
            --namespace campus-dev \
            --docker-server ghcr.io \
            --docker-username "${pull_username}" \
            --docker-password "${pull_password}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin deploy manifests to selected commit
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ steps.image-meta.outputs.image_tag }}"
          sed -i "s/newTag: dev-latest/newTag: ${IMAGE_TAG}/g" deploy/dev/kustomization.yaml
          grep -n "newTag:" deploy/dev/kustomization.yaml

      - name: Apply manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl delete deployment campus-test -n campus-dev --ignore-not-found
          kubectl delete service campus-test -n campus-dev --ignore-not-found
          kubectl delete httproute campus-test -n campus-dev --ignore-not-found
          kubectl delete job campus-importer -n campus-dev --ignore-not-found
          kubectl apply -f deploy/infra/envoy-gateway/gatewayclass.yaml
          kubectl apply -k deploy/dev

      - name: Wait for app rollouts
        shell: bash
        run: |
          set -euo pipefail
          for name in frontend auth backend campus-nginx; do
            kubectl rollout status "deployment/$name" -n campus-dev --timeout=300s
          done

      - name: Wait for importer job
        shell: bash
        run: |
          set -euo pipefail
          kubectl wait --for=condition=complete job/campus-importer -n campus-dev --timeout=600s
          kubectl logs job/campus-importer -n campus-dev

      - name: Show deployed resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl get all -n campus-dev -o wide
          kubectl get gateway,httproute,envoyproxy -n campus-dev -o wide
          kubectl get gatewayclass
          kubectl get svc -n envoy-gateway-system
