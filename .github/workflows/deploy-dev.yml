name: Deploy DEV

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: DEV runner activation and environment check
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on:
      - self-hosted
      - Linux
    timeout-minutes: 15
    environment: dev
    env:
      KUBECONFIG: /home/nexoc/.kube/config
      CAMPUS_SECRETS_ROOT: /home/nexoc/campus-secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Show workflow context
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow name: $GITHUB_WORKFLOW"
          echo "Event name: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner is alive"
          hostname
          whoami
          pwd
          uname -a

      - name: Verify required commands
        shell: bash
        run: |
          set -euo pipefail
          for cmd in bash kubectl curl sed mktemp; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "Missing required command: $cmd" >&2
              exit 1
            }
          done

      - name: Verify kubeconfig exists
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$KUBECONFIG" ]] || {
            echo "KUBECONFIG not found: $KUBECONFIG" >&2
            exit 1
          }
          ls -lah "$KUBECONFIG"

      - name: Verify cluster access
        shell: bash
        run: |
          set -euo pipefail

          retry_command() {
            local max_attempts="$1"
            local sleep_seconds="$2"
            shift 2

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi

              if (( attempt >= max_attempts )); then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi

              echo "Attempt ${attempt} failed: $*" >&2
              echo "Retrying in ${sleep_seconds}s..." >&2
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
          }

          kubectl config current-context || true
          retry_command 5 10 kubectl get nodes -o wide
          retry_command 5 10 kubectl get ns
          retry_command 5 10 kubectl get pods -A

      - name: Verify DEV host secret files
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$CAMPUS_SECRETS_ROOT/dev"
          required_files=(
            "$secret_dir/db-secrets.env"
            "$secret_dir/auth-secrets.env"
          )

          for path in "${required_files[@]}"; do
            [[ -f "$path" ]] || {
              echo "Missing required host secret file: $path" >&2
              exit 1
            }
          done

          ls -lah "$secret_dir"

      - name: Show deploy directory status
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root:"
          pwd
          echo
          echo "deploy tree:"
          ls -lah deploy || true
          echo
          echo "dev overlay:"
          ls -lah deploy/app/overlays/dev || true

      - name: Final success marker
        shell: bash
        run: |
          set -euo pipefail
          echo "DEV runner activation check passed."
          echo "GitHub Actions -> self-hosted runner -> cluster access -> secret files: OK"