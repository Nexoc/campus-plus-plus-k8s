    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: campus-plus-plus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
