apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: campus
  labels:
    app.kubernetes.io/name: campus
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: campus-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: campus-edge
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
