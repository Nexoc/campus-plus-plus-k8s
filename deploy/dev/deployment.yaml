apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-test
  template:
    metadata:
      labels:
        app: campus-test
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
