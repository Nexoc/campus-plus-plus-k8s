apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-nginx
  labels:
    app.kubernetes.io/name: campus-nginx
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: campus-nginx
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campus-nginx
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: campus-nginx
          image: campus-nginx:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |
              for service_name in frontend auth backend; do
                until nslookup "$service_name" >/dev/null 2>&1; do
                  echo "Waiting for DNS entry: $service_name" >&2
                  sleep 2
                done
              done
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
