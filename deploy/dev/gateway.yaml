apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: campus-dev
spec:
  gatewayClassName: campus-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: campus-dev-edge
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
