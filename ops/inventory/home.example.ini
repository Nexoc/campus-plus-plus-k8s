# Example inventory for the home lab.
# Keep logical hostnames and groups stable; copy this file to home.local.ini
# and replace placeholder addresses on the deployment host.
# Real home-lab IP addresses must not be committed.

[gw]
gw ansible_host=127.0.0.1 ansible_connection=local monitoring_scrape_host=<gw_ip>

[db]
s4-db ansible_host=<db_ip> monitoring_scrape_host=<db_ip>

[dev]
s5-dev ansible_host=<dev_ip> monitoring_scrape_host=<dev_ip>

[monitoring]
s6-monitoring ansible_host=<monitoring_ip> monitoring_scrape_host=<monitoring_ip>

[prod]
s1-prod ansible_host=<s1_ip> monitoring_scrape_host=<s1_ip>
s2-prod ansible_host=<s2_ip> monitoring_scrape_host=<s2_ip>
s3-prod ansible_host=<s3_ip> monitoring_scrape_host=<s3_ip>

[k3s_prod:children]
prod

[all:vars]
ansible_user=nexoc
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
ansible_python_interpreter=/usr/bin/python3
