# Example inventory for a lab environment.
# Keep logical hostnames and groups stable; copy this file to lab.local.ini
# and replace placeholder addresses on the deployment host.
# Real lab IP addresses must not be committed.

[gw]
gw ansible_host=127.0.0.1 ansible_connection=local monitoring_scrape_host=<LAB_GW_IP>

[db]
s4-db ansible_host=<LAB_DB_IP> monitoring_scrape_host=<LAB_DB_IP>

[dev]
s5-dev ansible_host=<LAB_DEV_IP> monitoring_scrape_host=<LAB_DEV_IP>

[monitoring]
s6-monitoring ansible_host=<LAB_MONITORING_IP> monitoring_scrape_host=<LAB_MONITORING_IP>

[prod]
s1-prod ansible_host=<LAB_PROD_1_IP> monitoring_scrape_host=<LAB_PROD_1_IP>
s2-prod ansible_host=<LAB_PROD_2_IP> monitoring_scrape_host=<LAB_PROD_2_IP>
s3-prod ansible_host=<LAB_PROD_3_IP> monitoring_scrape_host=<LAB_PROD_3_IP>

[k3s_prod:children]
prod

[all:vars]
ansible_user=nexoc
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
ansible_python_interpreter=/usr/bin/python3
