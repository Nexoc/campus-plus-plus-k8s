# Example inventory for a university environment.
# Keep the logical hostnames and groups the same; replace only ansible_host values.

[gw]
gw ansible_host=<UNIVERSITY_GW_IP> ansible_connection=local

[db]
s4-db ansible_host=<UNIVERSITY_DB_IP>

[dev]
s5-dev ansible_host=<UNIVERSITY_DEV_IP>

[monitoring]
s6-monitoring ansible_host=<UNIVERSITY_MONITORING_IP>

[prod]
s1-prod ansible_host=<UNIVERSITY_PROD_1_IP>
s2-prod ansible_host=<UNIVERSITY_PROD_2_IP>
s3-prod ansible_host=<UNIVERSITY_PROD_3_IP>

[k3s_prod:children]
prod

[all:vars]
ansible_user=nexoc
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

