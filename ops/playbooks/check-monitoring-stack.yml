---
# Execute from: gw
# Target: gw and s6-monitoring.
# Purpose: verify the central monitoring stack without requiring Grafana login
# credentials and without changing state.

- name: Check monitoring stack from s6-monitoring
  hosts: monitoring
  gather_facts: false
  vars:
    prometheus_port: 9090
    grafana_port: 3000
    grafana_datasource_path: /etc/grafana/provisioning/datasources/campus-prometheus.yml
    grafana_prometheus_url: http://localhost:9090
    grafana_dashboard_provider_path: /etc/grafana/provisioning/dashboards/campus-dashboards.yml
    grafana_dashboards:
      - name: Campus VM Overview
        path: /var/lib/grafana/dashboards/campus-vm-overview.json
      - name: Campus PostgreSQL Overview
        path: /var/lib/grafana/dashboards/campus-postgres-overview.json
      - name: Campus Kubernetes Overview
        path: /var/lib/grafana/dashboards/campus-k8s-overview.json
  tasks:
    - name: s6-monitoring | verify Prometheus readiness endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
        method: GET
        status_code: 200
        return_content: false
        timeout: 5

    - name: s6-monitoring | verify Prometheus query API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query=up"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: prometheus_query_api

    - name: s6-monitoring | require Prometheus query API success
      ansible.builtin.assert:
        that:
          - prometheus_query_api.json.status == "success"
          - prometheus_query_api.json.data.result | length > 0
        fail_msg: "Prometheus query API did not return any up metrics"

    - name: s6-monitoring | verify Grafana health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: grafana_health
      changed_when: false
      retries: 30
      delay: 2
      until: grafana_health.status == 200

    - name: s6-monitoring | require Grafana database status ok
      ansible.builtin.assert:
        that:
          - grafana_health.json.database == "ok"
        fail_msg: "Grafana health check did not report database=ok"

    - name: s6-monitoring | verify Grafana Prometheus datasource provisioning file exists
      ansible.builtin.stat:
        path: "{{ grafana_datasource_path }}"
      register: grafana_datasource_stat

    - name: s6-monitoring | require Grafana datasource provisioning file
      ansible.builtin.assert:
        that:
          - grafana_datasource_stat.stat.exists
          - grafana_datasource_stat.stat.isreg
        fail_msg: "Grafana Prometheus datasource provisioning file is missing"

    - name: s6-monitoring | verify Grafana datasource points at local Prometheus
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - "{{ grafana_prometheus_url }}"
          - "{{ grafana_datasource_path }}"
      changed_when: false
      become: true

    - name: s6-monitoring | verify Grafana datasource uid used by dashboards
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - "uid: campus-prometheus"
          - "{{ grafana_datasource_path }}"
      changed_when: false
      become: true

    - name: s6-monitoring | verify Grafana dashboard provider file exists
      ansible.builtin.stat:
        path: "{{ grafana_dashboard_provider_path }}"
      register: grafana_dashboard_provider_stat

    - name: s6-monitoring | require Grafana dashboard provider file
      ansible.builtin.assert:
        that:
          - grafana_dashboard_provider_stat.stat.exists
          - grafana_dashboard_provider_stat.stat.isreg
        fail_msg: "Grafana dashboard provider file is missing"

    - name: s6-monitoring | verify provisioned Grafana dashboard files exist
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: grafana_dashboard_stat
      loop: "{{ grafana_dashboards }}"
      loop_control:
        label: "{{ item.name }}"

    - name: s6-monitoring | require provisioned Grafana dashboard files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Grafana dashboard file is missing: {{ item.item.path }}"
      loop: "{{ grafana_dashboard_stat.results }}"
      loop_control:
        label: "{{ item.item.name }}"

- name: Check monitoring stack from gw
  hosts: gw
  gather_facts: false
  vars:
    prometheus_port: 9090
    grafana_port: 3000
    monitoring_host: "{{ hostvars[groups['monitoring'][0]].monitoring_scrape_host | default(hostvars[groups['monitoring'][0]].ansible_host | default(groups['monitoring'][0])) }}"
    postgres_exporter_job: postgres-exporter
    kube_state_metrics_dev_job: kube-state-metrics-dev
    kube_state_metrics_prod_job: kube-state-metrics-prod
  tasks:
    - name: gw | verify Prometheus readiness endpoint on s6-monitoring
      ansible.builtin.uri:
        url: "http://{{ monitoring_host }}:{{ prometheus_port }}/-/ready"
        method: GET
        status_code: 200
        return_content: false
        timeout: 5

    - name: gw | wait for all node-exporter targets to be up in Prometheus
      ansible.builtin.uri:
        url: "http://{{ monitoring_host }}:{{ prometheus_port }}/api/v1/targets?state=active"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: prometheus_targets_api
      no_log: true
      retries: 12
      delay: 5
      until:
        - prometheus_targets_api.json.status == "success"
        - "(prometheus_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', 'node-exporter') | selectattr('health', 'equalto', 'up') | list | length) == (groups['all'] | length)"

    - name: gw | require all node-exporter targets up
      ansible.builtin.assert:
        that:
          - prometheus_targets_api.json.status == "success"
          - "(prometheus_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', 'node-exporter') | selectattr('health', 'equalto', 'up') | list | length) == (groups['all'] | length)"
        fail_msg: "Not all node-exporter targets are up in Prometheus"

    - name: gw | wait for postgres-exporter target to be up in Prometheus
      ansible.builtin.uri:
        url: "http://{{ monitoring_host }}:{{ prometheus_port }}/api/v1/targets?state=active"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: postgres_exporter_targets_api
      no_log: true
      retries: 12
      delay: 5
      until:
        - postgres_exporter_targets_api.json.status == "success"
        - "(postgres_exporter_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', postgres_exporter_job) | selectattr('health', 'equalto', 'up') | list | length) == (groups['db'] | length)"

    - name: gw | require postgres-exporter target up
      ansible.builtin.assert:
        that:
          - postgres_exporter_targets_api.json.status == "success"
          - "(postgres_exporter_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', postgres_exporter_job) | selectattr('health', 'equalto', 'up') | list | length) == (groups['db'] | length)"
        fail_msg: "postgres-exporter target is not up in Prometheus"

    - name: gw | wait for dev kube-state-metrics target to be up in Prometheus
      ansible.builtin.uri:
        url: "http://{{ monitoring_host }}:{{ prometheus_port }}/api/v1/targets?state=active"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: kube_state_metrics_dev_targets_api
      no_log: true
      retries: 12
      delay: 5
      until:
        - kube_state_metrics_dev_targets_api.json.status == "success"
        - "(kube_state_metrics_dev_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', kube_state_metrics_dev_job) | selectattr('health', 'equalto', 'up') | list | length) == 1"

    - name: gw | require dev kube-state-metrics target up
      ansible.builtin.assert:
        that:
          - kube_state_metrics_dev_targets_api.json.status == "success"
          - "(kube_state_metrics_dev_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', kube_state_metrics_dev_job) | selectattr('health', 'equalto', 'up') | list | length) == 1"
        fail_msg: "dev kube-state-metrics target is not up in Prometheus"

    - name: gw | wait for prod kube-state-metrics target to be up in Prometheus
      ansible.builtin.uri:
        url: "http://{{ monitoring_host }}:{{ prometheus_port }}/api/v1/targets?state=active"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: kube_state_metrics_prod_targets_api
      no_log: true
      retries: 12
      delay: 5
      until:
        - kube_state_metrics_prod_targets_api.json.status == "success"
        - "(kube_state_metrics_prod_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', kube_state_metrics_prod_job) | selectattr('health', 'equalto', 'up') | list | length) == 1"

    - name: gw | require prod kube-state-metrics target up
      ansible.builtin.assert:
        that:
          - kube_state_metrics_prod_targets_api.json.status == "success"
          - "(kube_state_metrics_prod_targets_api.json.data.activeTargets | selectattr('labels.job', 'equalto', kube_state_metrics_prod_job) | selectattr('health', 'equalto', 'up') | list | length) == 1"
        fail_msg: "prod kube-state-metrics target is not up in Prometheus"

    - name: gw | verify Grafana health endpoint on s6-monitoring
      ansible.builtin.uri:
        url: "http://{{ monitoring_host }}:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: grafana_gw_health
      changed_when: false
      retries: 30
      delay: 2
      until: grafana_gw_health.status == 200

    - name: gw | require Grafana database status ok
      ansible.builtin.assert:
        that:
          - grafana_gw_health.json.database == "ok"
        fail_msg: "Grafana health check from gw did not report database=ok"
